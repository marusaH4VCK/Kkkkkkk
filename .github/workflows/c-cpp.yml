name: Build Zexis Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install make ldid xz

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export ARCHS=arm64
        make package FINALPACKAGE=1

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: Zexis-deb
        path: packages/*.deb

    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: Zexis-dylib
        path: .theos/obj/arm64/GameMenuUI.dylib
